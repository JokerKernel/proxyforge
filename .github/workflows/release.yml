name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to publish, for example v1.0.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  metadata:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      build_date: ${{ steps.metadata.outputs.build_date }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Read release metadata
        id: metadata
        shell: bash
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag must use semantic version form such as v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "release tag does not exist: ${RELEASE_TAG}" >&2
            exit 1
          fi
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          printf 'build_date=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

  build:
    name: Build linux/${{ matrix.arch }}
    needs: metadata
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      COMMIT: ${{ needs.metadata.outputs.commit }}
      BUILD_DATE: ${{ needs.metadata.outputs.build_date }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          OUTPUT="dist/proxyforge_linux_${{ matrix.arch }}_${VERSION}" ./scripts/build.sh

      - name: Verify embedded version
        if: matrix.arch == 'amd64'
        run: dist/proxyforge_linux_${{ matrix.arch }}_${VERSION} --version

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/proxyforge_linux_${{ matrix.arch }}_*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: release-linux-*
          path: dist
          merge-multiple: true

      - name: Generate version file and checksum manifest
        working-directory: dist
        run: |
          printf '%s\n' "${RELEASE_TAG}" > version
          sha256sum proxyforge_linux_*_"${RELEASE_TAG}" version > SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/proxyforge_linux_*_"${RELEASE_TAG}" dist/version dist/SHA256SUMS --clobber
          else
            gh release create "${RELEASE_TAG}" \
              dist/proxyforge_linux_*_"${RELEASE_TAG}" dist/version dist/SHA256SUMS \
              --verify-tag \
              --generate-notes \
              --title "ProxyForge ${RELEASE_TAG}"
          fi
